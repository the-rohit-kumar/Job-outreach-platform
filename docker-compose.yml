# One-command local run:  docker compose up --build
# App: http://localhost:3000   API: http://localhost:8000/api/health
services:
  api:
    build: ./backend
    container_name: outreachhub-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/outreach.db
      APP_SECRET: ${APP_SECRET:-dev-secret-change-me}
      APP_URL: http://localhost:3000
      API_URL: http://localhost:8000
    ports:
      - "8000:8000"
    volumes:
      - outreach_data:/app/data
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: outreachhub-web
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  outreach_data:
